<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 270" width="100%" height="270">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#21262d" />
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="840" height="270" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
  <rect width="840" height="270" rx="12" fill="url(#grid)" />

  <!-- Top Bar -->
  <circle cx="26" cy="24" r="4.5" fill="#f85149" />
  <circle cx="42" cy="24" r="4.5" fill="#d29922" />
  <circle cx="58" cy="24" r="4.5" fill="#3fb950" />
  <text x="76" y="28" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">ozzamantep // edge-iot-pipeline</text>

  <circle cx="742" cy="24" r="4" fill="#3fb950">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite" />
  </circle>
  <text x="754" y="28" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="bold">LIVE · 50 Hz</text>

  <!-- Connection Paths -->
  <path id="p1" d="M 240 105 L 325 105" fill="none" stroke="#30363d" stroke-width="2" stroke-dasharray="5 4" />
  <path id="p2" d="M 515 105 L 600 105" fill="none" stroke="#30363d" stroke-width="2" stroke-dasharray="5 4" />
  <path id="p3" d="M 695 142 L 695 211 L 535 211" fill="none" stroke="#30363d" stroke-width="2" stroke-dasharray="5 4" />
  <path id="p4" d="M 305 211 L 145 211 L 145 142" fill="none" stroke="#30363d" stroke-width="2" stroke-dasharray="5 4" />

  <!-- Animated Signal Packets -->
  <circle r="4" fill="#58a6ff" filter="url(#glow)">
    <animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#p1" /></animateMotion>
  </circle>
  <circle r="4" fill="#bc8cff" filter="url(#glow)">
    <animateMotion dur="1.6s" begin="0.4s" repeatCount="indefinite"><mpath href="#p2" /></animateMotion>
  </circle>
  <circle r="4" fill="#3fb950" filter="url(#glow)">
    <animateMotion dur="2.2s" begin="0.8s" repeatCount="indefinite"><mpath href="#p3" /></animateMotion>
  </circle>
  <circle r="4" fill="#d29922" filter="url(#glow)">
    <animateMotion dur="2.2s" begin="1.4s" repeatCount="indefinite"><mpath href="#p4" /></animateMotion>
  </circle>

  <!-- Node 1: SENSORS -->
  <rect x="50" y="68" width="190" height="74" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2" />
  <text x="145" y="98" text-anchor="middle" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="bold">SENSORS</text>
  <text x="145" y="118" text-anchor="middle" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">MPU6050 · I2C 0x68</text>
  <text x="145" y="133" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">ax, ay, az @ 50 Hz</text>

  <!-- Node 2: ESP32 EDGE ML -->
  <rect x="325" y="68" width="190" height="74" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="2" />
  <text x="420" y="98" text-anchor="middle" fill="#bc8cff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="bold">ESP32 EDGE ML</text>
  <text x="420" y="118" text-anchor="middle" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Random Forest (12)</text>
  <text x="420" y="133" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">21 Features · C++</text>

  <!-- Node 3: CLOUD & TWIN -->
  <rect x="600" y="68" width="190" height="74" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2" />
  <text x="695" y="98" text-anchor="middle" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="bold">CLOUD &amp; TWIN</text>
  <text x="695" y="118" text-anchor="middle" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">MQTT · HTTPS · JS</text>
  <text x="695" y="133" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">Telemetry &amp; ECA Rules</text>

  <!-- Node 4: ACTUATION & LOG -->
  <rect x="305" y="184" width="230" height="54" rx="8" fill="#161b22" stroke="#d29922" stroke-width="2" />
  <text x="420" y="207" text-anchor="middle" fill="#d29922" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="bold">ACTUATORS &amp; LOCAL LOG</text>
  <text x="420" y="225" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">3-LED · Buzzer · MicroSD · Alarms</text>
</svg>
